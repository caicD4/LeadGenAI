<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadGenAI — Autonomous Lead Discovery</title>
  <meta name="description" content="LeadGenAI: Autonomous AI-powered lead discovery, research, scoring, and outreach generation.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ── Reset & tokens ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0c14;
      --surface:   #111420;
      --surface2:  #181d2e;
      --border:    #232840;
      --border2:   #2e3450;
      --accent:    #6366f1;
      --accent2:   #818cf8;
      --green:     #10b981;
      --yellow:    #f59e0b;
      --red:       #ef4444;
      --text:      #e8eaf0;
      --muted:     #8892b0;
      --muted2:    #5a6380;
      --radius:    14px;
      --radius-sm: 8px;
      font-size: 15px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Layout ───────────────────────────────────────────────────────── */
    .container { width: 92%; max-width: 1280px; margin: 0 auto; padding: 48px 0 80px; }

    /* ── Header ───────────────────────────────────────────────────────── */
    .header { margin-bottom: 44px; }
    .header h1 {
      font-size: 2.4rem; font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #818cf8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      letter-spacing: -0.5px; margin-bottom: 8px;
    }
    .header p { color: var(--muted); font-size: 1rem; }

    /* ── Search box ───────────────────────────────────────────────────── */
    .search-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 28px;
    }
    .search-label { display: block; font-weight: 600; color: var(--text); margin-bottom: 14px; font-size: 0.95rem; letter-spacing: 0.2px; }
    .input-row { display: flex; gap: 12px; }
    .search-input {
      flex: 1; padding: 14px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border2);
      background: #0d1020;
      color: var(--text); font-size: 0.95rem; font-family: inherit;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .btn-primary {
      padding: 14px 28px; border: none; border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: #fff; font-size: 0.95rem; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: opacity 0.2s, transform 0.1s; white-space: nowrap;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── Progress bar ─────────────────────────────────────────────────── */
    .progress-wrap { margin-bottom: 24px; display: none; }
    .progress-wrap.visible { display: block; }
    .progress-bar-track {
      height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 10px;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      transition: width 0.5s ease;
      width: 0%;
    }
    .progress-text { font-size: 0.85rem; color: var(--muted); }

    /* ── Status line ──────────────────────────────────────────────────── */
    #status { margin-bottom: 16px; font-size: 0.9rem; color: var(--muted); min-height: 1.4em; }
    #status.error { color: #f87171; }
    #status.success { color: var(--green); }

    /* ── Tabs ─────────────────────────────────────────────────────────── */
    .tabs { display: flex; gap: 4px; margin-bottom: 28px; border-bottom: 1px solid var(--border); }
    .tab-btn {
      padding: 10px 20px; background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--muted); font-size: 0.9rem; font-family: inherit; font-weight: 500;
      cursor: pointer; margin-bottom: -1px; transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn.active { color: var(--accent2); border-bottom-color: var(--accent); }
    .tab-btn:hover:not(.active) { color: var(--text); }

    /* ── Results header ───────────────────────────────────────────────── */
    .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .results-header h2 { font-size: 1.4rem; font-weight: 600; }
    .lead-count { color: var(--muted); font-size: 0.9rem; }

    /* ── Lead grid ────────────────────────────────────────────────────── */
    .leads-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }

    /* ── Lead card ────────────────────────────────────────────────────── */
    .lead-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex; flex-direction: column; gap: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .lead-card:hover { border-color: var(--border2); box-shadow: 0 4px 24px rgba(0,0,0,0.3); }

    /* Card header */
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .company-meta { flex: 1; min-width: 0; }
    .company-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 500;
    }
    .badge-industry { background: rgba(99,102,241,0.15); color: var(--accent2); border: 1px solid rgba(99,102,241,0.25); }
    .badge-location { background: rgba(16,185,129,0.1); color: #34d399; border: 1px solid rgba(16,185,129,0.2); }
    .badge-booking  { background: rgba(245,158,11,0.1); color: #fbbf24; border: 1px solid rgba(245,158,11,0.2); }
    .badge-whatsapp { background: rgba(34,197,94,0.1); color: #4ade80; border: 1px solid rgba(34,197,94,0.2); }

    /* Score badge */
    .score-badge {
      flex-shrink: 0; width: 56px; height: 56px; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 700; border: 2px solid;
    }
    .score-badge .score-num { font-size: 1.1rem; line-height: 1; }
    .score-badge .score-label { font-size: 0.6rem; opacity: 0.8; }
    .score-high   { border-color: var(--green); color: var(--green); background: rgba(16,185,129,0.1); }
    .score-medium { border-color: var(--yellow); color: var(--yellow); background: rgba(245,158,11,0.1); }
    .score-low    { border-color: var(--red); color: var(--red); background: rgba(239,68,68,0.1); }

    /* Website link */
    .website-link { color: var(--accent2); text-decoration: none; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 4px; }
    .website-link:hover { text-decoration: underline; }

    /* Section titles */
    .section-title { font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }

    /* Summary */
    .summary { font-size: 0.88rem; color: var(--muted); line-height: 1.65; }

    /* Why good lead */
    .why-box { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; }
    .why-text { font-size: 0.85rem; color: #c8d0e8; line-height: 1.6; }

    /* Score breakdown */
    .score-breakdown { display: flex; flex-direction: column; gap: 5px; }
    .score-row { display: flex; align-items: center; gap: 8px; }
    .score-row-label { font-size: 0.78rem; color: var(--muted); min-width: 130px; }
    .score-row-bar-track { flex: 1; height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .score-row-bar-fill { height: 100%; border-radius: 99px; background: var(--accent); }
    .score-row-val { font-size: 0.78rem; color: var(--text); min-width: 32px; text-align: right; }

    /* Opportunities */
    .opp-list { display: flex; flex-direction: column; gap: 8px; }
    .opp-item { display: flex; gap: 10px; align-items: flex-start; }
    .opp-priority {
      flex-shrink: 0; padding: 2px 7px; border-radius: 4px; font-size: 0.68rem; font-weight: 700;
      margin-top: 2px;
    }
    .opp-priority-HIGH   { background: rgba(16,185,129,0.2); color: #34d399; }
    .opp-priority-MEDIUM { background: rgba(245,158,11,0.2); color: #fbbf24; }
    .opp-priority-LOW    { background: rgba(99,102,241,0.2); color: var(--accent2); }
    .opp-content { flex: 1; }
    .opp-name { font-size: 0.88rem; font-weight: 600; color: var(--text); }
    .opp-reason { font-size: 0.8rem; color: var(--muted); margin-top: 2px; line-height: 1.5; }

    /* Sources */
    .sources-list { display: flex; flex-direction: column; gap: 4px; }
    .source-link { color: var(--accent2); font-size: 0.8rem; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
    .source-link:hover { text-decoration: underline; }

    /* Card actions */
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 4px; border-top: 1px solid var(--border); }
    .btn-secondary {
      padding: 8px 16px; border-radius: var(--radius-sm);
      background: none; border: 1px solid var(--border2);
      color: var(--muted); font-size: 0.82rem; font-family: inherit; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent2); background: rgba(99,102,241,0.08); }

    /* ── Collapsible sections ─────────────────────────────────────────── */
    .collapsible-header {
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; user-select: none;
    }
    .collapsible-header .chevron { transition: transform 0.2s; font-size: 0.8rem; color: var(--muted2); }
    .collapsible-header.open .chevron { transform: rotate(180deg); }
    .collapsible-body { overflow: hidden; }
    .collapsible-body.hidden { display: none; }

    /* ── Empty state ──────────────────────────────────────────────────── */
    .empty {
      text-align: center; padding: 80px 40px; color: var(--muted2);
      border: 1px dashed var(--border); border-radius: var(--radius);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 16px; }
    .empty h3 { font-size: 1.1rem; color: var(--muted); margin-bottom: 8px; }

    /* ── Modal overlay ────────────────────────────────────────────────── */
    .modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.65); z-index: 1000;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: var(--radius); padding: 28px; width: 100%; max-width: 620px;
      max-height: 90vh; overflow-y: auto;
      animation: slideUp 0.2s ease;
    }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-title { font-size: 1.1rem; font-weight: 700; }
    .modal-close { background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; line-height: 1; padding: 4px; }
    .modal-close:hover { color: var(--text); }

    /* Outreach channel tabs */
    .channel-tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .channel-tab {
      padding: 8px 16px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--muted);
      font-size: 0.85rem; font-family: inherit; font-weight: 500; cursor: pointer;
      transition: all 0.15s;
    }
    .channel-tab.active { background: rgba(99,102,241,0.2); border-color: var(--accent); color: var(--accent2); }
    .channel-tab:hover:not(.active) { border-color: var(--border2); color: var(--text); }

    /* Outreach content */
    .outreach-subject { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
    .outreach-message {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 16px;
      font-size: 0.88rem; line-height: 1.7; color: var(--text);
      white-space: pre-wrap; min-height: 120px;
    }
    .outreach-facts { margin-top: 14px; }
    .outreach-facts-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .fact-tag {
      display: inline-block; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; padding: 3px 8px; font-size: 0.75rem; color: var(--muted2); margin: 3px;
    }
    .btn-copy {
      display: block; width: 100%; margin-top: 12px;
      padding: 10px; background: var(--accent); border: none; border-radius: var(--radius-sm);
      color: #fff; font-size: 0.88rem; font-family: inherit; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-copy:hover { opacity: 0.85; }
    .generating-msg { text-align: center; padding: 32px; color: var(--muted); }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ───────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .input-row { flex-direction: column; }
      .btn-primary { width: 100%; }
      .leads-grid { grid-template-columns: 1fr; }
      .header h1 { font-size: 1.8rem; }
    }
  </style>
</head>

<body>
<div class="container">

  <!-- Header -->
  <header class="header">
    <h1>⚡ LeadGenAI</h1>
    <p>Autonomous AI-powered lead discovery, research, scoring, and outreach.</p>
  </header>

  <!-- Search box -->
  <section class="search-box">
    <label class="search-label" for="criteria">What kind of leads do you want to find?</label>
    <div class="input-row">
      <input id="criteria" class="search-input" type="text"
        placeholder="e.g. Medspas in Delhi, AI automation companies in India"
        autocomplete="off">
      <button id="findBtn" class="btn-primary" onclick="findLeads()">Find Leads</button>
    </div>
  </section>

  <!-- Progress bar -->
  <div id="progressWrap" class="progress-wrap">
    <div class="progress-bar-track">
      <div id="progressFill" class="progress-bar-fill"></div>
    </div>
    <div id="progressText" class="progress-text"></div>
  </div>

  <!-- Status line -->
  <div id="status"></div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-job" onclick="switchTab('job')">Current Search</button>
    <button class="tab-btn" id="tab-saved" onclick="switchTab('saved')">Saved Leads</button>
  </div>

  <!-- Current job results -->
  <div id="panel-job">
    <div class="results-header">
      <h2>Results</h2>
      <span id="count" class="lead-count"></span>
    </div>
    <div id="leads" class="leads-grid">
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <h3>No search yet</h3>
        <p>Enter your criteria above and click Find Leads.</p>
      </div>
    </div>
  </div>

  <!-- Saved leads panel -->
  <div id="panel-saved" style="display:none">
    <div class="results-header">
      <h2>Saved Leads</h2>
      <span id="saved-count" class="lead-count"></span>
    </div>
    <div id="saved-leads" class="leads-grid">
      <div class="empty">
        <div class="empty-icon">💾</div>
        <h3>No saved leads yet</h3>
        <p>Run a search first.</p>
      </div>
    </div>
  </div>

</div><!-- /.container -->


<!-- Outreach modal -->
<div id="outreachModal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="outreachModalTitle">Generate Outreach</span>
      <button class="modal-close" onclick="closeOutreachModal()">✕</button>
    </div>

    <div class="channel-tabs">
      <button class="channel-tab active" id="ctab-email"    onclick="switchChannel('email')">✉ Email</button>
      <button class="channel-tab"        id="ctab-whatsapp" onclick="switchChannel('whatsapp')">💬 WhatsApp</button>
      <button class="channel-tab"        id="ctab-linkedin" onclick="switchChannel('linkedin')">💼 LinkedIn</button>
    </div>

    <div id="outreachContent">
      <div class="generating-msg"><span class="spinner"></span>Generating personalised outreach…</div>
    </div>
  </div>
</div>


<script>
// ============================================================
// CONFIG
// ============================================================
const API = "http://127.0.0.1:8000";
let _currentTab = "job";
let _outreachData = {};   // { email: {...}, whatsapp: {...}, linkedin: {...} }
let _currentLeadId = null;


// ============================================================
// TAB SWITCHING
// ============================================================
function switchTab(tab) {
  _currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById(`tab-${tab}`).classList.add("active");
  document.getElementById("panel-job").style.display   = tab === "job"   ? "" : "none";
  document.getElementById("panel-saved").style.display = tab === "saved" ? "" : "none";
  if (tab === "saved") loadSavedLeads();
}


// ============================================================
// MAIN SEARCH
// ============================================================
async function findLeads() {
  const input  = document.getElementById("criteria");
  const btn    = document.getElementById("findBtn");
  const status = document.getElementById("status");
  const leads  = document.getElementById("leads");
  const count  = document.getElementById("count");

  const criteria = input.value.trim();
  if (!criteria) {
    setStatus("Please enter what kind of leads you want.", "error");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Searching…";
  setStatus("Creating search job…");
  showProgress(0, "Starting…");
  leads.innerHTML = "";
  count.textContent = "";

  try {
    // 1. POST /generate-leads
    const r = await fetch(`${API}/generate-leads`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({criteria, max_results: 5}),
    });
    if (!r.ok) throw new Error(`Server error: HTTP ${r.status}`);
    const {job_id} = await r.json();
    if (!job_id) throw new Error("Server did not return a job ID.");

    setStatus(`Job created (${job_id.slice(0, 8)})…`);

    // 2. Poll
    await pollJob(job_id);

  } catch (err) {
    console.error(err);
    setStatus(`❌ ${err.message}`, "error");
    leads.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><h3>Search failed</h3><p>${escHtml(err.message)}</p></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Find Leads";
  }
}


async function pollJob(jobId) {
  const status = document.getElementById("status");
  const leads  = document.getElementById("leads");
  const count  = document.getElementById("count");

  while (true) {
    await sleep(2000);
    let job;
    try {
      const r = await fetch(`${API}/jobs/${jobId}`);
      if (r.status === 404) throw new Error("Job not found — backend may have restarted.");
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      job = await r.json();
    } catch (pollErr) {
      setStatus(`⚠️ Polling error: ${pollErr.message}. Retrying…`, "error");
      await sleep(3000);
      continue;
    }

    const pct = job.progress ?? 0;
    const msg = job.message || "Working…";
    showProgress(pct, msg);
    setStatus(`${msg} (${pct}%)`);

    if (job.status === "completed") {
      hideProgress();
      const resultLeads = Array.isArray(job.leads) ? job.leads : [];
      renderLeads(resultLeads, "leads");
      count.textContent = `${resultLeads.length} lead(s) found`;
      setStatus(`✓ Finished — ${resultLeads.length} lead(s) researched and scored.`, "success");
      break;
    }

    if (job.status === "failed") {
      hideProgress();
      throw new Error(job.message || "Lead generation failed.");
    }
  }
}


// ============================================================
// SAVED LEADS
// ============================================================
async function loadSavedLeads() {
  const container = document.getElementById("saved-leads");
  const count     = document.getElementById("saved-count");
  container.innerHTML = `<div class="generating-msg"><span class="spinner"></span>Loading saved leads…</div>`;

  try {
    const r = await fetch(`${API}/leads`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const {leads} = await r.json();
    renderLeads(leads, "saved-leads");
    count.textContent = `${leads.length} total`;
  } catch (err) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><h3>Could not load saved leads</h3><p>${escHtml(err.message)}</p></div>`;
  }
}


// ============================================================
// RENDER LEAD CARDS
// ============================================================
function renderLeads(leads, containerId) {
  const container = document.getElementById(containerId);

  if (!Array.isArray(leads) || leads.length === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><h3>No leads found</h3><p>Try adjusting your criteria.</p></div>`;
    return;
  }

  container.innerHTML = leads.map(lead => buildLeadCard(lead)).join("");
}


function buildLeadCard(lead) {
  const name        = lead.company_name || "Unknown Company";
  const score       = lead.score ?? 0;
  const industry    = lead.industry || "";
  const location    = lead.location || "";
  const website     = lead.website || "";
  const summary     = lead.company_summary || lead.description || "";
  const whyGood     = lead.why_good_lead || lead.score_reasoning || "";
  const opportunities = Array.isArray(lead.opportunities) ? lead.opportunities : [];
  const sources     = Array.isArray(lead.sources) ? lead.sources : [];
  const hasBooking  = lead.online_booking || lead.research?.facts?.online_booking_present;
  const hasWA       = lead.whatsapp || lead.research?.facts?.whatsapp_contact_present;
  const leadId      = lead.lead_id || "";
  const breakdown   = lead.score_breakdown || {};
  const services    = lead.products_or_services || lead.research?.facts?.products_or_services || [];

  // Score class
  const scoreClass = score >= 75 ? "score-high" : score >= 50 ? "score-medium" : "score-low";

  // Badges
  const badgesHtml = [
    industry && `<span class="badge badge-industry">🏢 ${escHtml(industry)}</span>`,
    location && `<span class="badge badge-location">📍 ${escHtml(location)}</span>`,
    hasBooking && `<span class="badge badge-booking">📅 Booking</span>`,
    hasWA && `<span class="badge badge-whatsapp">💬 WhatsApp</span>`,
  ].filter(Boolean).join("");

  // Score breakdown bars
  const breakdownHtml = Object.entries(breakdown).map(([key, val]) => {
    if (typeof val !== "object") return "";
    const s = val.score ?? 0;
    const m = val.max  ?? 25;
    const label = key.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    const pct = m > 0 ? Math.round((s / m) * 100) : 0;
    return `
      <div class="score-row">
        <span class="score-row-label">${escHtml(label)}</span>
        <div class="score-row-bar-track"><div class="score-row-bar-fill" style="width:${pct}%"></div></div>
        <span class="score-row-val">${s}/${m}</span>
      </div>`;
  }).join("");

  // Opportunities
  const oppsHtml = opportunities.slice(0, 5).map(opp => `
    <div class="opp-item">
      <span class="opp-priority opp-priority-${escHtml(opp.priority || 'MEDIUM')}">${escHtml(opp.priority || 'MED')}</span>
      <div class="opp-content">
        <div class="opp-name">${escHtml(opp.opportunity || '')}</div>
        <div class="opp-reason">${escHtml(opp.reasoning || '')}</div>
      </div>
    </div>`).join("");

  // Sources
  const srcsHtml = sources.slice(0, 3).map(s => `
    <a class="source-link" href="${escAttr(s.url)}" target="_blank" rel="noopener noreferrer">
      🔗 ${escHtml(s.title || s.url)}
    </a>`).join("");

  // Services list
  const servicesHtml = services.slice(0, 5).map(s => `
    <span style="display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:0.75rem;color:var(--muted2);margin:2px 3px 2px 0;">
      ${escHtml(typeof s === "string" ? s : JSON.stringify(s))}
    </span>`).join("");

  return `
<article class="lead-card">

  <!-- Header row: company info + score -->
  <div class="card-header">
    <div class="company-meta">
      <div class="company-name" title="${escAttr(name)}">${escHtml(name)}</div>
      <div class="badges">${badgesHtml}</div>
      ${website ? `<a class="website-link" href="${escAttr(website)}" target="_blank" rel="noopener noreferrer">🌐 ${escHtml(website)}</a>` : ""}
    </div>
    <div class="score-badge ${scoreClass}">
      <span class="score-num">${score}</span>
      <span class="score-label">/100</span>
    </div>
  </div>

  <!-- Summary -->
  ${summary ? `
  <div>
    <div class="section-title">Company Summary</div>
    <p class="summary">${escHtml(summary)}</p>
  </div>` : ""}

  <!-- Why this lead -->
  ${whyGood ? `
  <div>
    <div class="section-title">Why This Lead?</div>
    <div class="why-box"><p class="why-text">${escHtml(whyGood)}</p></div>
  </div>` : ""}

  <!-- Score breakdown -->
  ${breakdownHtml ? `
  <div>
    <div class="collapsible-header" onclick="toggleSection(this)">
      <div class="section-title" style="margin-bottom:0">Score Breakdown</div>
      <span class="chevron">▼</span>
    </div>
    <div class="collapsible-body hidden" style="margin-top:10px">
      <div class="score-breakdown">${breakdownHtml}</div>
    </div>
  </div>` : ""}

  <!-- Opportunities -->
  ${oppsHtml ? `
  <div>
    <div class="section-title">Automation Opportunities</div>
    <div class="opp-list">${oppsHtml}</div>
  </div>` : ""}

  <!-- Services -->
  ${servicesHtml ? `
  <div>
    <div class="collapsible-header" onclick="toggleSection(this)">
      <div class="section-title" style="margin-bottom:0">Services / Products</div>
      <span class="chevron">▼</span>
    </div>
    <div class="collapsible-body hidden" style="margin-top:8px">${servicesHtml}</div>
  </div>` : ""}

  <!-- Sources -->
  ${srcsHtml ? `
  <div>
    <div class="collapsible-header" onclick="toggleSection(this)">
      <div class="section-title" style="margin-bottom:0">Sources</div>
      <span class="chevron">▼</span>
    </div>
    <div class="collapsible-body hidden" style="margin-top:8px">
      <div class="sources-list">${srcsHtml}</div>
    </div>
  </div>` : ""}

  <!-- Actions -->
  <div class="card-actions">
    ${leadId ? `<button class="btn-secondary" onclick="openOutreach(${leadId}, ${escAttr(JSON.stringify(name))})">✉ Generate Outreach</button>` : ""}
    ${website ? `<button class="btn-secondary" onclick="window.open('${escAttr(website)}', '_blank')">🌐 Visit Website</button>` : ""}
  </div>

</article>`;
}


// ============================================================
// COLLAPSIBLE SECTIONS
// ============================================================
function toggleSection(header) {
  header.classList.toggle("open");
  const body = header.nextElementSibling;
  body.classList.toggle("hidden");
}


// ============================================================
// OUTREACH MODAL
// ============================================================
async function openOutreach(leadId, companyName) {
  _currentLeadId = leadId;
  _outreachData = {};

  document.getElementById("outreachModalTitle").textContent = `Outreach — ${companyName}`;
  document.getElementById("outreachContent").innerHTML =
    `<div class="generating-msg"><span class="spinner"></span>Generating personalised outreach…</div>`;
  document.getElementById("outreachModal").classList.add("open");

  // Reset channel tabs
  document.querySelectorAll(".channel-tab").forEach(b => b.classList.remove("active"));
  document.getElementById("ctab-email").classList.add("active");

  try {
    const r = await fetch(`${API}/leads/${leadId}/outreach`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({channel: "all"}),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({detail: `HTTP ${r.status}`}));
      throw new Error(err.detail || `HTTP ${r.status}`);
    }
    const {outreach} = await r.json();
    _outreachData = outreach;
    renderOutreach("email");
  } catch (err) {
    document.getElementById("outreachContent").innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div><h3>Failed to generate outreach</h3><p>${escHtml(err.message)}</p></div>`;
  }
}


function closeOutreachModal() {
  document.getElementById("outreachModal").classList.remove("open");
}

// Close on backdrop click.
document.getElementById("outreachModal").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeOutreachModal();
});


function switchChannel(ch) {
  document.querySelectorAll(".channel-tab").forEach(b => b.classList.remove("active"));
  document.getElementById(`ctab-${ch}`).classList.add("active");
  renderOutreach(ch);
}


function renderOutreach(channel) {
  const container = document.getElementById("outreachContent");
  const data = _outreachData[channel];

  if (!data) {
    container.innerHTML = `<div class="generating-msg">No outreach data for ${channel}.</div>`;
    return;
  }

  const facts = Array.isArray(data.personalization_facts) ? data.personalization_facts : [];
  const factsHtml = facts.map(f => `<span class="fact-tag">${escHtml(f)}</span>`).join("");

  container.innerHTML = `
    ${channel === "email" && data.subject ? `<div class="outreach-subject">Subject: <strong>${escHtml(data.subject)}</strong></div>` : ""}
    <div class="outreach-message" id="outreach-msg-${channel}">${escHtml(data.message || "")}</div>
    ${factsHtml ? `<div class="outreach-facts"><div class="outreach-facts-label">Personalisation facts used</div>${factsHtml}</div>` : ""}
    ${data.recommended_action ? `<div style="margin-top:12px;font-size:0.82rem;color:var(--muted)">Next step: ${escHtml(data.recommended_action)}</div>` : ""}
    <button class="btn-copy" onclick="copyOutreach('outreach-msg-${channel}')">Copy Message</button>
  `;
}


function copyOutreach(elemId) {
  const el = document.getElementById(elemId);
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(() => {
    const btn = el.nextElementSibling?.nextElementSibling?.nextElementSibling;
    if (btn && btn.classList.contains("btn-copy")) {
      btn.textContent = "Copied!";
      setTimeout(() => btn.textContent = "Copy Message", 2000);
    }
  }).catch(() => {});
}


// ============================================================
// PROGRESS
// ============================================================
function showProgress(pct, msg) {
  document.getElementById("progressWrap").classList.add("visible");
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = msg;
}

function hideProgress() {
  document.getElementById("progressWrap").classList.remove("visible");
}


// ============================================================
// STATUS
// ============================================================
function setStatus(msg, type = "") {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = type;
}


// ============================================================
// UTILITIES
// ============================================================
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function escHtml(v) {
  return String(v ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escAttr(v) { return escHtml(v); }


// ============================================================
// ENTER KEY
// ============================================================
document.getElementById("criteria").addEventListener("keydown", e => {
  if (e.key === "Enter") findLeads();
});
</script>
